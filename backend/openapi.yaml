openapi: 3.0.3
info:
  title: BookVault API
  description: |
    REST API for the BookVault e-commerce bookstore.
    All protected endpoints require a Bearer JWT token in the Authorization header.
  version: 1.0.0
  contact:
    name: BookVault Team

servers:
  - url: http://127.0.0.1:3001/api
    description: Local development

tags:
  - name: Auth
  - name: Books
  - name: Categories
  - name: Brands
  - name: Cart
  - name: Orders
  - name: Addresses
  - name: Payments
  - name: GiftPoints

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ─── Common ────────────────────────────────────────────────────────────────
    Error:
      type: object
      required: [message, statusCode]
      properties:
        message: { type: string }
        code:    { type: string }
        statusCode: { type: integer }

    Pagination:
      type: object
      properties:
        total:      { type: integer }
        page:       { type: integer }
        limit:      { type: integer }
        totalPages: { type: integer }

    # ─── User ─────────────────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:          { type: string, format: uuid }
        email:       { type: string, format: email }
        name:        { type: string }
        phone:       { type: string, nullable: true }
        role:        { type: string, enum: [customer, admin] }
        giftPoints:  { type: integer }
        createdAt:   { type: string, format: date-time }

    # ─── Auth ─────────────────────────────────────────────────────────────────
    AuthResponse:
      type: object
      properties:
        user:  { $ref: '#/components/schemas/User' }
        token: { type: string }

    # ─── Book ─────────────────────────────────────────────────────────────────
    Category:
      type: object
      properties:
        id:   { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }

    Publisher:
      type: object
      properties:
        id:   { type: string, format: uuid }
        name: { type: string }

    Book:
      type: object
      properties:
        id:          { type: string, format: uuid }
        title:       { type: string }
        author:      { type: string }
        publisher:   { $ref: '#/components/schemas/Publisher' }
        price:       { type: number }
        discountPct: { type: integer, minimum: 0, maximum: 90 }
        coverUrl:    { type: string, format: uri, nullable: true }
        description: { type: string, nullable: true }
        isbn:        { type: string, nullable: true }
        pages:       { type: integer, nullable: true }
        language:    { type: string }
        rating:      { type: number, minimum: 0, maximum: 5 }
        reviewCount: { type: integer }
        stock:       { type: integer }
        categories:
          type: array
          items: { $ref: '#/components/schemas/Category' }

    BookListResponse:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Book' }

    # ─── Address ──────────────────────────────────────────────────────────────
    Address:
      type: object
      properties:
        id:        { type: string, format: uuid }
        label:     { type: string }
        street:    { type: string }
        city:      { type: string }
        state:     { type: string }
        pincode:   { type: string }
        isDefault: { type: boolean }

    # ─── Cart ─────────────────────────────────────────────────────────────────
    CartItem:
      type: object
      properties:
        id:       { type: string, format: uuid }
        book:     { $ref: '#/components/schemas/Book' }
        quantity: { type: integer, minimum: 1 }

    Cart:
      type: object
      properties:
        id:                { type: string, format: uuid }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        subtotal:          { type: number }
        discount:          { type: number }
        giftPointsApplied: { type: integer }
        total:             { type: number }

    # ─── Order ────────────────────────────────────────────────────────────────
    OrderStatus:
      type: string
      enum: [pending, confirmed, processing, shipped, delivered, cancelled]

    OrderItem:
      type: object
      properties:
        id:        { type: string, format: uuid }
        book:      { $ref: '#/components/schemas/Book' }
        quantity:  { type: integer }
        unitPrice: { type: number }

    Payment:
      type: object
      properties:
        id:             { type: string, format: uuid }
        method:         { type: string, enum: [card, upi, netbanking, cod] }
        status:         { type: string, enum: [pending, success, failed] }
        transactionRef: { type: string, nullable: true }
        amount:         { type: number }
        paidAt:         { type: string, format: date-time, nullable: true }

    Order:
      type: object
      properties:
        id:              { type: string, format: uuid }
        status:          { $ref: '#/components/schemas/OrderStatus' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        address:         { $ref: '#/components/schemas/Address' }
        subtotal:        { type: number }
        discount:        { type: number }
        giftPointsUsed:  { type: integer }
        total:           { type: number }
        payment:         { $ref: '#/components/schemas/Payment' }
        createdAt:       { type: string, format: date-time }
        updatedAt:       { type: string, format: date-time }

    # ─── Gift Points ──────────────────────────────────────────────────────────
    GiftPointsBalance:
      type: object
      properties:
        balance:        { type: integer }
        pendingEarning: { type: integer }

# =============================================================================
# PATHS
# =============================================================================
paths:

  # ─── Auth ───────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:     { type: string, minLength: 2 }
                email:    { type: string, format: email }
                password: { type: string, minLength: 8 }
                phone:    { type: string }
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '409':
          description: Email already in use
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (invalidates token server-side if using token blocklist)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Logged out }

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  # ─── Books ──────────────────────────────────────────────────────────────────
  /books:
    get:
      tags: [Books]
      summary: List books with filtering, searching and sorting
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
        - in: query
          name: search
          schema: { type: string }
          description: Full-text search across title and author
        - in: query
          name: category
          schema: { type: string }
          description: Category slug
        - in: query
          name: brand
          schema: { type: string, format: uuid }
          description: Publisher ID
        - in: query
          name: sort
          schema:
            type: string
            enum: [relevance, price-asc, price-desc, rating, newest, bestseller]
        - in: query
          name: minPrice
          schema: { type: number }
        - in: query
          name: maxPrice
          schema: { type: number }
      responses:
        '200':
          description: Paginated book list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookListResponse' }

  /books/featured:
    get:
      tags: [Books]
      summary: Get featured books
      responses:
        '200':
          description: Featured books
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Book' }

  /books/recommendations:
    get:
      tags: [Books]
      summary: Get recommendations based on a book
      parameters:
        - in: query
          name: bookId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Recommended books
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Book' }

  /books/{id}:
    get:
      tags: [Books]
      summary: Get a single book by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Book details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '404':
          description: Book not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ─── Categories ─────────────────────────────────────────────────────────────
  /categories:
    get:
      tags: [Categories]
      summary: List all categories
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }

  # ─── Brands ─────────────────────────────────────────────────────────────────
  /brands:
    get:
      tags: [Brands]
      summary: List all publishers/brands
      responses:
        '200':
          description: Publishers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Publisher' }

  # ─── Cart ───────────────────────────────────────────────────────────────────
  /cart:
    get:
      tags: [Cart]
      summary: Get current user's cart
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }

    delete:
      tags: [Cart]
      summary: Clear the cart
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Cart cleared }

  /cart/items:
    post:
      tags: [Cart]
      summary: Add item to cart
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookId, quantity]
              properties:
                bookId:   { type: string, format: uuid }
                quantity: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400':
          description: Insufficient stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /cart/items/{id}:
    patch:
      tags: [Cart]
      summary: Update cart item quantity
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }

    delete:
      tags: [Cart]
      summary: Remove item from cart
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }

  # ─── Orders ─────────────────────────────────────────────────────────────────
  /orders:
    get:
      tags: [Orders]
      summary: List current user's orders
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Order list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }

    post:
      tags: [Orders]
      summary: Create a new order from cart
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [addressId, paymentMethod]
              properties:
                addressId:       { type: string, format: uuid }
                paymentMethod:   { type: string, enum: [card, upi, netbanking, cod] }
                giftPointsToUse: { type: integer, minimum: 0 }
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400':
          description: Validation error (empty cart, insufficient stock, etc.)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get order by ID
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404':
          description: Order not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orders/{id}/cancel:
    patch:
      tags: [Orders]
      summary: Cancel order (within 48 hours)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400':
          description: Cancellation window expired or order not cancellable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ─── Addresses ──────────────────────────────────────────────────────────────
  /addresses:
    get:
      tags: [Addresses]
      summary: List user's addresses
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Addresses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Address' }

    post:
      tags: [Addresses]
      summary: Add a new address
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, street, city, state, pincode]
              properties:
                label:   { type: string }
                street:  { type: string }
                city:    { type: string }
                state:   { type: string }
                pincode: { type: string, pattern: '^\d{6}$' }
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }

  /addresses/{id}:
    put:
      tags: [Addresses]
      summary: Update an address
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Address' }
      responses:
        '200':
          description: Updated address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }

    delete:
      tags: [Addresses]
      summary: Delete an address
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Address deleted }

  # ─── Payments ───────────────────────────────────────────────────────────────
  /payments:
    post:
      tags: [Payments]
      summary: Initiate payment for an order
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, method]
              properties:
                orderId: { type: string, format: uuid }
                method:  { type: string, enum: [card, upi, netbanking, cod] }
      responses:
        '200':
          description: Payment result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }

  /payments/{id}/status:
    get:
      tags: [Payments]
      summary: Get payment status
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Payment status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }

  # ─── Gift Points ─────────────────────────────────────────────────────────────
  /gift-points/balance:
    get:
      tags: [GiftPoints]
      summary: Get current gift points balance
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GiftPointsBalance' }

  /gift-points/redeem:
    post:
      tags: [GiftPoints]
      summary: Redeem gift points against an order
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, points]
              properties:
                orderId: { type: string, format: uuid }
                points:  { type: integer, minimum: 1 }
      responses:
        '200':
          description: Updated balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GiftPointsBalance' }
        '400':
          description: Insufficient points or exceeds 20% limit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
